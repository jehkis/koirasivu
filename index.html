<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lempieläimeni</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
            line-height: 1.6;
            color: #222;
            background-color: #ffffff;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        p {
            font-size: 1rem;
            margin: 1rem 0;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 1.5rem 0;
        }

        a {
            color: #1a1a1a;
            text-decoration: underline;
        }

        a:hover {
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Koira</h1>

    <p>Moikka! Olen Joona, ja tämä on pieni sivu suosikkieläimestäni.</p>

    <p>Koira on lempieläimeni. Se on uskollinen, iloinen ja aina valmis seikkailuun.</p>

    <img src="img/20230623_153216.jpg" alt="Musta-valkoinen koira makaa nurmikolla">

    <p><a href="https://fi.wikipedia.org/wiki/Koira" target="_blank">Lue lisää koirista Wikipediasta</a></p>

</body>
</html>
